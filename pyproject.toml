[project]
name = "participation-report"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "pillow>=12.2.0",
    "pyqt6>=6.9.1",
    "python-dotenv>=1.2.2",
    "svglib>=1.6.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11.2",
    "pandas-stubs>=2.2.2.240909",
    "pyinstaller>=6.16.0",
    "pytest>=8.3.3",
    "ruff>=0.7.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
files = ["src"]
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
